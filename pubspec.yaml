name: omnyshell
description: >-
  Secure, Hub-centric remote shell platform written in pure Dart. Clients
  connect to a Hub by node identity (not host:port); the Hub authenticates,
  authorizes and brokers encrypted sessions to Nodes over WebSocket-on-TLS.
  Ships Hub, Node, Client and CLI implementations behind first-class Dart APIs.
version: 1.8.3
repository: https://github.com/OmnyGrid/omnyshell

environment:
  sdk: ^3.10.9

executables:
  omnyshell: omnyshell

dependencies:
  args: ^2.7.0
  cryptography: ^2.9.0
  dart_service_manager: ^1.2.2
  #ffi: ^2.1.0
  meta: ^1.18.3
  omnydrive: ^1.1.2
  #portable_pty: ^0.0.5  # waiting crash fix.
  shelf: ^1.4.2
  shelf_web_socket: ^3.0.0
  uuid: ^4.5.3
  web_socket_channel: ^3.0.3
  yaml: ^3.1.3
  yaml_edit: ^2.2.4

dev_dependencies:
  dependency_validator: ^5.0.5
  lints: ^6.1.0
  test: ^1.31.1

# The only "secret" in the tree is a throwaway self-signed certificate/key used
# by the test harness to exercise real wss connections on localhost.
false_secrets:
  - /test/support/certs/localhost.key

